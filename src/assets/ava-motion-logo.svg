<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Animated AvA Groups logo">
<defs>
 <radialGradient id="bg"><stop stop-color="#151d2a"/><stop offset=".65" stop-color="#080c14"/><stop offset="1" stop-color="#03050a"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a9ba7"/><stop offset=".22" stop-color="#fff"/><stop offset=".5" stop-color="#a3b7c2"/><stop offset=".7" stop-color="#f9fbff"/><stop offset="1" stop-color="#71848e"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#00d8ff" stop-opacity="0"/><stop offset=".5" stop-color="#b8f8ff" stop-opacity=".75"/><stop offset="1" stop-color="#00d8ff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="halo"><feGaussianBlur stdDeviation="65"/></filter>
 <pattern id="led" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.3" fill="#6cbfd3" opacity=".12"/></pattern>
 <clipPath id="frame"><rect width="1920" height="1080"/></clipPath>
</defs>
<style>
 svg{background:#03050a} .stage{animation:stage 7s ease-in-out infinite} .lineL{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 7s cubic-bezier(.21,.82,.28,1) infinite}.lineR{stroke-dasharray:640;stroke-dashoffset:640;animation:draw 7s cubic-bezier(.21,.82,.28,1) .12s infinite}.a1{animation:left 7s cubic-bezier(.19,1,.22,1) infinite;transform-origin:960px 500px}.v{animation:up 7s cubic-bezier(.19,1,.22,1) infinite;transform-origin:960px 500px}.a2{animation:right 7s cubic-bezier(.19,1,.22,1) infinite;transform-origin:960px 500px}.word{animation:word 7s ease-in-out infinite}.tag{animation:tag 7s ease-in-out infinite}.flare{animation:sweep 7s ease-in-out infinite}.border{animation:border 7s ease-in-out infinite}.dots{animation:dots 7s ease-in-out infinite}
 @keyframes left{0%,8%{opacity:0;transform:translateX(-260px) rotateY(62deg) scale(.82)}29%,84%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(1.10)}}
 @keyframes right{0%,10%{opacity:0;transform:translateX(260px) rotateY(-62deg) scale(.82)}31%,84%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(1.10)}}
 @keyframes up{0%,11%{opacity:0;transform:translateY(140px) scale(.7)}34%,84%{opacity:1;transform:none}94%,100%{opacity:0;transform:scale(1.10)}}
 @keyframes word{0%,31%{opacity:0;transform:translateY(32px);letter-spacing:28px}45%,83%{opacity:1;transform:none;letter-spacing:18px}93%,100%{opacity:0}}
 @keyframes tag{0%,41%{opacity:0}52%,84%{opacity:.9}94%,100%{opacity:0}}
 @keyframes draw{0%,10%{stroke-dashoffset:640;opacity:0}35%,76%{stroke-dashoffset:0;opacity:.8}92%,100%{opacity:0}}
 @keyframes sweep{0%,37%{opacity:0;transform:translateX(-1000px)}45%{opacity:.9}66%,100%{opacity:0;transform:translateX(2200px)}}
 @keyframes border{0%,25%{opacity:0;transform:scale(.85)}44%,84%{opacity:.8;transform:scale(1)}95%,100%{opacity:0;transform:scale(1.05)}}
 @keyframes dots{0%,7%{opacity:0}18%,82%{opacity:.3}96%,100%{opacity:0}}
 @keyframes stage{0%,6%{opacity:0}23%,84%{opacity:1}98%,100%{opacity:0}}
</style>
<g clip-path="url(#frame)">
 <rect width="1920" height="1080" fill="url(#bg)"/>
 <g class="stage"><ellipse cx="960" cy="520" rx="580" ry="230" fill="#00a5de" opacity=".12" filter="url(#halo)"/><rect x="190" y="110" width="1540" height="850" rx="18" fill="url(#led)"/></g>
 <g class="border" fill="none" stroke="#52d9fb" stroke-width="2" opacity=".5"><path d="M310 335V240H450 M1470 240H1610V335 M310 750V845H450 M1470 845H1610V750"/></g>
 <g filter="url(#glow)" fill="none" stroke="#1faccb" stroke-width="2" opacity=".65"><path class="lineL" d="M480 550L645 295H760"/><path class="lineR" d="M1440 550L1275 295H1160"/></g>
 <g font-family="Arial,Helvetica,sans-serif" fill="url(#metal)" text-anchor="middle" font-size="266" font-weight="200" letter-spacing="-15">
 <text class="a1" x="735" y="612">A</text><text class="v" x="968" y="612">v</text><text class="a2" x="1200" y="612">A</text>
 </g>
 <path class="tag" d="M640 677H1280" stroke="#80dcf5" stroke-width="1.5" opacity=".8"/>
 <text class="word" x="960" y="753" fill="#e4eff6" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="65" letter-spacing="18" text-anchor="middle">GROUPS</text>
 <text class="tag" x="960" y="819" fill="#7fa8b9" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="9" text-anchor="middle">VISUAL EXPERIENCES</text>
 <rect class="flare" x="-300" y="230" width="240" height="640" fill="url(#beam)" opacity="0" transform="skewX(-22)"/>
 <g class="dots" fill="#b6effd"><circle cx="345" cy="540" r="2"/><circle cx="1560" cy="540" r="2"/><circle cx="960" cy="186" r="2"/><circle cx="960" cy="895" r="2"/></g>
</g>
</svg>
